<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Round Lobby</title>
	<style>
		@font-face { font-family: Lora; src: url("{{lora_regular}}"); }
		@font-face { font-family: Lora; font-weight: 700; src: url("{{lora_bold}}"); }
		@font-face { font-family: Pterra; src: url("{{pterra}}"); }
		@font-face { font-family: NewRocker; src: url("{{newrocker}}"); }
		* { box-sizing: border-box; }
		html, body { height: 100%; overflow: hidden; }
		body { margin: 0; background: #100d0e; color: #ded1c2; font: 13px/1.45 Lora, Georgia, serif; scrollbar-color: #594046 #100d0e; }
		.lobby { display: flex; flex-direction: column; height: 100%; }
		.lobby-heading { flex: 0 0 auto; padding: 8px 10px; border-bottom: 1px solid #594046; }
		h1 { margin: 0; font: normal 22px/1.2 NewRocker, Pterra, Georgia, serif; }
		.round-status { flex: 0 0 auto; padding: 4px 10px 7px; border-bottom: 1px solid #594046; }
		.round-ledger { margin: 0 0 5px; }
		.round-ledger div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid #382b2f; }
		.round-ledger dt { color: #b9a6a0; }
		.round-ledger dd { margin: 0; font-weight: bold; }
		#readybonus .good { color: #a6b18c; }
		#readybonus .highlight { color: #d3acb0; }
		.bonus-toggle { display: inline-block; margin-top: 4px; padding: 2px 6px; border: 1px solid #594046; background: #281b1f; font: inherit; color: #ded1c2; cursor: pointer; }
		.bonus-toggle:hover { background: #42222a; border-color: #ae8189; }
		.bonus-toggle:focus { outline: 2px solid #ae8189; outline-offset: 2px; }
		#bonus-details { display: none; margin-top: 6px; color: #b9a6a0; }
		#bonus-details p { margin: 0; }
		.roster { flex: 1 1 auto; min-height: 0; height: 0; overflow: auto; padding: 8px 10px; scrollbar-face-color: #594046; scrollbar-track-color: #100d0e; scrollbar-arrow-color: #ded1c2; }
		h2 { font: normal 17px/1.3 Pterra, Georgia, serif; margin: 0 0 2px; }
		.roster-note { color: #b9a6a0; font-size: 12px; margin: 0 0 8px; }
		#jobs { overflow-wrap: anywhere; word-wrap: break-word; }
		#jobs h3 { margin: 10px 0 0; padding-bottom: 3px; border-bottom: 1px solid #594046; font: normal 15px/1.3 Pterra, Georgia, serif; color: #d3acb0; }
		#jobs .department:first-child h3 { margin-top: 0; }
		.job-list { border-collapse: collapse; table-layout: fixed; width: 100%; }
		.job-list th, .job-list td { padding: 5px 0; vertical-align: top; text-align: left; border-bottom: 1px solid #382b2f; }
		.job-list th { width: 39%; padding-right: 8px; font-weight: normal; }
		.job-count { color: #b9a6a0; white-space: nowrap; }
		#roster-empty { color: #b9a6a0; margin: 8px 0; }
	</style>
	<script>
		function update_timer(text) {
			document.getElementById("timer").innerText = text;
		}
		function update_ready_count(text) {
			document.getElementById("readycount").innerText = text;
		}
		function update_ready_bonus(html) {
			document.getElementById("readybonus").innerHTML = html;
		}
		function update_jobs(html) {
			if (update_jobs.lastHtml === html) {
				return;
			}
			var jobs = document.getElementById("jobs");
			var roster = document.getElementById("roster");
			var scrollTop = roster.scrollTop;
			jobs.innerHTML = html;
			document.getElementById("roster-empty").style.display = jobs.getElementsByTagName("h3").length ? "none" : "block";
			roster.scrollTop = scrollTop;
			update_jobs.lastHtml = html;
		}
		function toggle_bonus(link) {
			var details = document.getElementById("bonus-details");
			var opening = details.style.display !== "block";
			details.style.display = opening ? "block" : "none";
			link.setAttribute("aria-expanded", opening ? "true" : "false");
			link.innerHTML = (opening ? "&#8722; " : "+ ") + "Readiness bonus";
			return false;
		}
	</script>
</head>
<body>
	<div class="lobby">
		<header class="lobby-heading"><h1>Round Lobby</h1></header>
		<div class="round-status">
			<dl class="round-ledger">
				<div><dt>Round begins in</dt><dd id="timer">&mdash;</dd></div>
				<div><dt>Players ready</dt><dd id="readycount">&mdash;</dd></div>
			</dl>
			<div id="readybonus">Updating readiness&hellip;</div>
			<button class="bonus-toggle" type="button" aria-controls="bonus-details" aria-expanded="false" onclick="toggle_bonus(this);">+ Readiness bonus</button>
			<div id="bonus-details"><p>Ready before the round starts to receive 20 mammons in a stashed pouch, full hydration, the Great Meal bonus, and +1 Triumph.</p></div>
		</div>
		<div id="roster" class="roster" tabindex="0" aria-label="Ready roster">
			<h2>Ready Roster</h2>
			<p class="roster-note">Preferred classes; assignments pending.</p>
			<div id="jobs"></div>
			<p id="roster-empty">Waiting for ready players&hellip;</p>
		</div>
	</div>
</body>
</html>
